# Build the STT-A STT API service image and push it to the infra/core "models" repo. Run from the repo root:
#   gcloud builds submit deployments/stt-a-qwen3-asr-diar-vertex/services/stt_api \
#     --config=deployments/stt-a-qwen3-asr-diar-vertex/services/stt_api/cloudbuild.yaml \
#     --substitutions=_REGION=$GCP_REGION,_TAG=0.2.0
# _TAG must match var.stt_api_image_tag in ../../variables.tf.
substitutions:
  _REGION: us-central1
  _TAG: 0.2.0
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/models/stt-a-qwen3-asr-diar-api:${_TAG}

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]

images: ["${_IMAGE}"]

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY
